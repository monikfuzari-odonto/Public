<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monik Fit">
  <title>Monik Fit — Treino &amp; Nutrição (Atualizado Out/2026)</title>

  <!-- CSS 100% Embutido e Autossuficiente (funciona offline na academia sem CDN externo) -->
  <style>
    :root {
      --bg: #0b1120;
      --bg-deep: #080d19;
      --card: #131c31;
      --card-elev: #1b2742;
      --border: #23304d;
      --border-soft: rgba(148, 163, 184, 0.16);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --rose: #f43f5e;
      --rose-light: #fb7185;
      --rose-soft: rgba(244, 63, 94, 0.15);
      --rose-border: rgba(244, 63, 94, 0.42);

      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.15);
      --emerald-border: rgba(16, 185, 129, 0.42);

      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --amber-border: rgba(245, 158, 11, 0.42);

      --cyan: #38bdf8;
      --cyan-soft: rgba(56, 189, 248, 0.14);
      --cyan-border: rgba(56, 189, 248, 0.42);

      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.16);

      --radius-xl: 18px;
      --radius-lg: 14px;
      --radius-md: 11px;
      --shadow-card: 0 8px 24px -6px rgba(0, 0, 0, 0.48);
      --shadow-rose: 0 8px 22px -4px rgba(244, 63, 94, 0.36);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: contain;
      line-height: 1.45;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 92px;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.36;
      pointer-events: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    .hidden {
      display: none !important;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .anim-in {
      animation: fadeUp 0.2s ease-out forwards;
    }

    /* ==================== HEADER ==================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 17, 32, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--rose), var(--rose-light));
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.38);
      flex-shrink: 0;
      letter-spacing: 0.4px;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--emerald);
      flex-shrink: 0;
    }

    .sync-dot.saving {
      background: var(--amber);
    }

    .brand-sub {
      margin: 1px 0 0;
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-top {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 800;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      white-space: nowrap;
    }

    .btn-top.hip {
      color: #fcd34d;
      border-color: var(--amber-border);
      background: rgba(245, 158, 11, 0.11);
    }

    .btn-top.save {
      color: #7dd3fc;
      border-color: var(--cyan-border);
      background: rgba(56, 189, 248, 0.11);
    }

    .desktop-nav {
      display: none;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 4px;
      border-radius: 13px;
      gap: 4px;
      margin-left: 4px;
    }

    .desktop-nav button {
      min-height: 38px;
      padding: 7px 13px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .desktop-nav button.active {
      background: linear-gradient(135deg, var(--rose), var(--rose-light));
      color: #fff;
    }

    /* ==================== MAIN ==================== */
    .main-wrap {
      flex: 1;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 14px 12px 24px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stack-sm {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    /* ==================== SURFACES ==================== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 15px;
      box-shadow: var(--shadow-card);
    }

    .card-elev {
      background: var(--card-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
    }

    .card-dark {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px;
    }

    .hero-card {
      background: linear-gradient(145deg, #16213a 0%, #131c31 58%, rgba(244, 63, 94, 0.18) 100%);
      border: 1px solid var(--rose-border);
      border-radius: var(--radius-xl);
      padding: 16px;
      box-shadow: var(--shadow-card);
    }

    .cyan-card {
      background: linear-gradient(145deg, #131c31 0%, rgba(56, 189, 248, 0.14) 100%);
      border: 1px solid var(--cyan-border);
      border-radius: var(--radius-xl);
      padding: 15px;
      box-shadow: var(--shadow-card);
    }

    .clinical-banner {
      background: linear-gradient(145deg, rgba(245, 158, 11, 0.1) 0%, #131c31 100%);
      border: 1px solid var(--amber-border);
      border-radius: var(--radius-xl);
      padding: 14px;
    }

    /* ==================== TYPOGRAPHY & BADGES ==================== */
    .sec-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin: 0;
    }

    .h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      color: #fff;
      line-height: 1.25;
    }

    .h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }

    .muted {
      color: var(--text-muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-rose {
      background: var(--rose-soft);
      color: #fda4af;
      border: 1px solid var(--rose-border);
    }

    .badge-emerald {
      background: var(--emerald-soft);
      color: #6ee7b7;
      border: 1px solid var(--emerald-border);
    }

    .badge-amber {
      background: var(--amber-soft);
      color: #fcd34d;
      border: 1px solid var(--amber-border);
    }

    .badge-cyan {
      background: var(--cyan-soft);
      color: #7dd3fc;
      border: 1px solid var(--cyan-border);
    }

    .badge-red {
      background: var(--red-soft);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.42);
    }

    /* ==================== BUTTONS (MIN 44PX TOUCH TARGETS) ==================== */
    .btn-primary {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--rose), var(--rose-light));
      box-shadow: var(--shadow-rose);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-emerald {
      width: 100%;
      min-height: 44px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 900;
      color: #052e1c;
      background: var(--emerald);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-cyan {
      width: 100%;
      min-height: 44px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 900;
      color: #082f49;
      background: var(--cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-secondary {
      min-height: 44px;
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      background: var(--card-elev);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline-emerald {
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      color: #6ee7b7;
      background: var(--bg);
      border: 1px solid var(--emerald-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline-rose {
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      color: #fda4af;
      background: var(--bg);
      border: 1px solid var(--rose-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-outline-cyan {
      min-height: 44px;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      color: #7dd3fc;
      background: var(--bg);
      border: 1px solid var(--cyan-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* ==================== LAYOUT HELPERS ==================== */
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .row-start {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .flex-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .grid-2-fixed {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    /* ==================== HIP PROTOCOL BANNER ==================== */
    .hip-banner {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--amber-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }

    .hip-banner-head {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      text-align: left;
      color: #fcd34d;
      font-size: 12px;
      font-weight: 800;
    }

    .hip-banner-body {
      padding: 10px 14px 12px;
      border-top: 1px solid rgba(245, 158, 11, 0.24);
      font-size: 12px;
      color: #fef3c7;
      line-height: 1.5;
    }

    .hip-banner-body ul {
      margin: 4px 0 0;
      padding-left: 18px;
    }

    .hip-banner-body li {
      margin-bottom: 4px;
    }

    /* ==================== WORKOUT SELECTOR A-E ==================== */
    .w-pill {
      position: relative;
      min-height: 70px;
      padding: 9px 3px;
      border-radius: 13px;
      background: var(--card);
      border: 2px solid var(--border);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .w-pill.selected {
      border-color: var(--rose);
      background: rgba(244, 63, 94, 0.14);
    }

    .w-pill .w-letter {
      font-size: 17px;
      font-weight: 900;
      color: #fff;
    }

    .w-pill.selected .w-letter {
      color: #fda4af;
    }

    .w-pill .w-name {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 3px;
    }

    .w-pill .w-date {
      font-size: 9px;
      color: var(--text-dim);
      font-weight: 700;
    }

    .w-pill .rec-dot {
      position: absolute;
      top: -5px;
      right: 5px;
      width: 11px;
      height: 11px;
      border-radius: 99px;
      background: var(--emerald);
      border: 2px solid var(--bg);
    }

    /* ==================== EXERCISE CARDS & SUBSTITUTES ==================== */
    .ex-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-card.is-sub {
      border-color: var(--emerald-border);
    }

    .ex-num {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: var(--card-elev);
      color: #fda4af;
      font-size: 12px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sub-strip {
      padding-top: 9px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .chip {
      min-height: 38px;
      padding: 7px 11px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      background: var(--card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .chip.active-base {
      background: var(--rose-soft);
      color: #fecdd3;
      border-color: var(--rose);
    }

    .chip.active-sub {
      background: var(--emerald-soft);
      color: #a7f3d0;
      border-color: var(--emerald);
    }

    .hip-alert-box {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid var(--amber-border);
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 12px;
      color: #fef3c7;
      line-height: 1.45;
    }

    /* ==================== VIDEO THUMBNAIL (ZERO ERRO 153) ==================== */
    .video-thumb-wrap {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(135deg, #1b2742 0%, #0b1120 62%, #3a1223 100%);
      border: 1px solid var(--border);
    }

    .video-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      display: block;
    }

    .video-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11, 17, 32, 0.92), rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.14));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      text-align: center;
      gap: 10px;
    }

    .play-circle {
      width: 58px;
      height: 58px;
      border-radius: 999px;
      background: #e11d48;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 26px rgba(225, 29, 72, 0.55);
      border: 3px solid rgba(255, 255, 255, 0.25);
    }

    .video-caption {
      background: rgba(11, 17, 32, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      color: #fff;
    }

    .video-iframe-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
    }

    .video-iframe-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* ==================== MUSCLE SVG BOX ==================== */
    .guide-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .muscle-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ==================== GUIDED WORKOUT ==================== */
    .sticky-session {
      position: sticky;
      top: 63px;
      z-index: 20;
      background: rgba(19, 28, 49, 0.96);
      backdrop-filter: blur(10px);
      border: 1px solid var(--rose-border);
      border-radius: var(--radius-xl);
      padding: 13px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.52);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: var(--bg);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--rose), var(--emerald));
      transition: width 0.35s ease;
    }

    .progress-fill.cyan-only {
      background: linear-gradient(90deg, #0284c7, var(--cyan));
    }

    .progress-fill.emerald-only {
      background: linear-gradient(90deg, #059669, var(--emerald));
    }

    .set-row {
      display: grid;
      grid-template-columns: 36px 1fr 1fr 48px;
      gap: 6px;
      align-items: center;
      padding: 8px 7px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .set-row.done {
      background: rgba(16, 185, 129, 0.14);
      border-color: var(--emerald-border);
    }

    .set-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--card-elev);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .set-row.done .set-badge {
      background: var(--emerald);
      color: #052e1c;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .step-btn {
      width: 34px;
      height: 44px;
      border-radius: 10px;
      background: var(--card-elev);
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-input {
      width: 100%;
      min-width: 34px;
      height: 44px;

    function mergeStateSafely(raw) {
      const base = createInitialState();
      if (!raw || typeof raw !== 'object') return base;
      const merged = {
        ...base,
        ...raw,
        version: 2,
        mealSubs: { ...base.mealSubs, ...(raw.mealSubs || {}) },
        preferredExVariant: { ...base.preferredExVariant, ...(raw.preferredExVariant || {}) },
        dailyLogs: { ...base.dailyLogs, ...(raw.dailyLogs || {}) },
        workoutHistory: Array.isArray(raw.workoutHistory) ? raw.workoutHistory : [],
        bodyLogs: Array.isArray(raw.bodyLogs) && raw.bodyLogs.length ? raw.bodyLogs : base.bodyLogs
      };
      if (!WORKOUTS[merged.selectedWorkoutId]) merged.selectedWorkoutId = 'A';
      if (!DIET_MODES[merged.dietMode]) merged.dietMode = 'recomp';
      return merged;
    }

    function loadState() {
      try {
        const str = localStorage.getItem(STORAGE_KEY);
        if (str) state = mergeStateSafely(JSON.parse(str));
      } catch (err) {
        console.warn('Falha ao ler localStorage:', err);
        state = createInitialState();
      }
    }

    function persistState() {
      state.updatedAt = Date.now();
      const dot = document.getElementById('syncDot');
      if (dot) dot.classList.add('saving');
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.warn('Falha ao salvar localStorage:', err);
      }
      setTimeout(() => { if (dot) dot.classList.remove('saving'); }, 220);
    }

    // ==================== UTILITÁRIOS ====================
    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatShortDate(isoOrYmd) {
      if (!isoOrYmd) return '--/--';
      const p = String(isoOrYmd).slice(0, 10).split('-');
      return p.length === 3 ? `${p[2]}/${p[1]}/${p[0].slice(2)}` : String(isoOrYmd);
    }

    function formatShortDateTime(iso) {
      if (!iso) return '--';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return formatShortDate(iso);
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')} às ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function formatMMSS(sec) {
      const s = Math.max(0, Math.floor(Number(sec) || 0));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function playChime(isPlank = false) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const freqs = isPlank ? [523.25, 659.25, 783.99] : [587.33, 880];
        freqs.forEach((f, idx) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + idx * 0.15);
          g.gain.setValueAtTime(0.13, now + idx * 0.15);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.14);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(now + idx * 0.15);
          osc.stop(now + idx * 0.15 + 0.15);
        });
      } catch (e) {}
      if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
        try { navigator.vibrate(isPlank ? [140, 70, 140, 70, 140] : [110, 70, 110]); } catch (e) {}
      }
    }

    function showToast(msg, type = 'success') {
      const wrap = document.getElementById('toastWrap');
      if (!wrap) return;
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2800);
    }

    // ==================== CRONÔMETROS ====================
    function startFloatTimer(seconds, mode = 'rest') {
      stopFloatTimer();
      ui.timerSec = Math.max(5, Number(seconds) || 45);
      const bar = document.getElementById('floatTimer');
      const box = document.getElementById('floatTimerBox');
      const lbl = document.getElementById('floatTimerLabel');
      const disp = document.getElementById('floatTimerDisplay');
      const icon = document.getElementById('floatTimerIcon');
      const isPlank = mode === 'plank';

      if (box) box.classList.toggle('plank-mode', isPlank);
      if (lbl) {
        lbl.textContent = isPlank ? 'Prancha Isométrica' : 'Descanso';
        lbl.style.color = isPlank ? '#fda4af' : '#6ee7b7';
      }
      if (icon) icon.textContent = isPlank ? '🧘‍♀️' : '⏱';
      if (disp) disp.textContent = formatMMSS(ui.timerSec);
      if (bar) bar.classList.remove('hidden');

      ui.timerInterval = setInterval(() => {
        ui.timerSec--;
        if (disp) disp.textContent = formatMMSS(ui.timerSec);
        if (ui.timerSec <= 0) {
          stopFloatTimer();
          playChime(isPlank);
          showToast(isPlank ? '✨ Prancha de 35s concluída! Excelente core!' : '⏱ Descanso concluído! Próxima série!', 'success');
        }
      }, 1000);
    }

    function stopFloatTimer() {
      clearInterval(ui.timerInterval);
      ui.timerInterval = null;
      ui.timerSec = 0;
      const bar = document.getElementById('floatTimer');
      if (bar) bar.classList.add('hidden');
    }

    function getSessionElapsedSec(s = state.activeSession) {
      if (!s) return 0;
      const base = Number(s.accumulatedSec) || 0;
      if (!s.running || !s.resumedAt) return base;
      return base + Math.max(0, Math.floor((Date.now() - s.resumedAt) / 1000));
    }

    function ensureSessionTicker() {
      clearInterval(ui.sessionTickInterval);
      if (!state.activeSession || !state.activeSession.running) return;
      ui.sessionTickInterval = setInterval(() => {
        if (!state.activeSession || !state.activeSession.running) {
          clearInterval(ui.sessionTickInterval);
          return;
        }
        const elapsed = getSessionElapsedSec(state.activeSession);
        const tEl = document.getElementById('sessionTimerDisplay');
        const bEl = document.getElementById('sessionTimeBar');
        if (tEl) tEl.textContent = formatMMSS(elapsed);
        if (bEl) bEl.style.width = `${Math.min(100, Math.round((elapsed / 1800) * 100))}%`;
      }, 1000);
    }

    function getExerciseVariants(ex) {
      const list = [{
        name: ex.name,
        shortName: ex.shortName || ex.name,
        videoId: ex.videoId,
        note: ex.tip,
        isometria: Boolean(ex.isometria),
        repMin: ex.repMin,
        repMax: ex.repMax,
        repLabel: ex.repLabel,
        isPrincipal: true
      }];
      (ex.substitutes || []).forEach(sub => {
        const isIso = typeof sub.isometria === 'boolean' ? sub.isometria : Boolean(ex.isometria);
        const rMin = sub.repMin || ex.repMin;
        const rMax = sub.repMax || ex.repMax;
        list.push({
          name: sub.name,
          shortName: sub.shortName || sub.name,
          videoId: sub.videoId || ex.videoId,
          note: sub.note || ex.tip,
          isometria: isIso,
          repMin: rMin,
          repMax: rMax,
          repLabel: isIso ? `${rMin}s` : (rMin === rMax ? `${rMax}` : `${rMin}–${rMax}`),
          isPrincipal: false
        });
      });
      return list;
    }

    function getActiveExerciseOption(ex, variantIdx = 0) {
      const list = getExerciseVariants(ex);
      const safe = (typeof variantIdx === 'number' && variantIdx >= 0 && variantIdx < list.length) ? variantIdx : 0;
      return { ...list[safe], index: safe };
    }

    function getLastRecordForExercise(exId, exactName = null) {
      if (exactName) {
        for (const sess of state.workoutHistory) {
          const f = (sess.exercises || []).find(e => e.exId === exId && e.executedName === exactName && e.sets.some(st => st.done));
          if (f) return { date: sess.completedAt, hipStatus: sess.hipStatus, isometria: Boolean(f.isometria), executedName: f.executedName, sets: f.sets.filter(st => st.done) };
        }
      }
      for (const sess of state.workoutHistory) {
        const f = (sess.exercises || []).find(e => e.exId === exId && e.sets.some(st => st.done));
        if (f) return { date: sess.completedAt, hipStatus: sess.hipStatus, isometria: Boolean(f.isometria), executedName: f.executedName, sets: f.sets.filter(st => st.done) };
      }
      return null;
    }

    function getProgressionTip(ex, opt, lastRec) {
      if (opt.isometria) {
        return !lastRec
          ? { type: 'init', label: '🛡️ Estreia Core', text: 'Segure 35s em linha reta com glúteos e abdômen firmes, sem dor no quadril.' }
          : { type: 'keep', label: '✨ Controle Postural', text: 'Mantenha 35s limpos com respiração calma e zero queda de lombar.' };
      }
      if (!lastRec) {
        return { type: 'init', label: '🛡️ Estreia Segura', text: `Use carga moderada p/ ${opt.repLabel} reps (cadência 2-1-2), deixando 2–3 reps na reserva (RIR 2–3).` };
      }
      const hadPain = lastRec.hipStatus === 'discomfort';
      const hitTop = lastRec.sets.length >= ex.sets && lastRec.sets.every(st => Number(st.reps) >= opt.repMax);
      const maxKg = Math.max(...lastRec.sets.map(st => Number(st.kg) || 0));
      if (hitTop && maxKg > 0 && !hadPain) {
        return { type: 'up', label: '⬆ Subir Levemente', text: `Fechou ${opt.repMax} reps sem dor! Suba +1 a +2,5 kg (ou +1 placa leve) e mire ${opt.repMin} reps limpas.` };
      }
      return { type: 'keep', label: '🎯 Consolidar', text: `Mantenha ${maxKg > 0 ? maxKg + ' kg' : 'a placa'} e busque +1 rep limpa sempre com RIR 2–3 e quadril confortável.` };
    }

      if (typeof state.dailyLogs[k].steps !== 'number') state.dailyLogs[k].steps = Number(state.dailyLogs[k].steps) || 0;
      return state.dailyLogs[k];
    }

            ${variants.map((v, idx) => {

          ${!c ? `
            <div class="hip-banner-body">
              <ul>
                <li><strong>Regra dos ≤ 90°:</strong> evite flexão profunda do quadril ou qualquer dor aguda/pinçamento na virilha esquerda.</li>
                <li><strong>Cadência 2-1-2 &amp; RIR 2–3:</strong> controle a descida em 2s e pare sempre com 2–3 repetições na reserva (sem falha extrema).</li>

              <span>Iniciar ${recW.name} Guiado (~${recW.estMin} min)</span>
            </button>

          <!-- Seletor Livre A-E -->
          <section class="stack-sm">
            <div class="row-between" style="padding:0 2px;">
              <h3 class="sec-label">Escolher Treino (Sem Dia Fixo)</h3>
              <span style="font-size:11px;color:#6ee7b7;font-weight:700;">100% Máquinas &amp; Polias</span>
            </div>

              ${WORKOUT_ORDER.map(id => {

              <div>

                <p class="muted" style="margin:3px 0 0;">
                  ${lastSel
                    ? `Última execução: ${formatShortDateTime(lastSel.completedAt)} · ${formatMMSS(lastSel.durationSec)} · ${Number(lastSel.totalVolumeKg).toLocaleString('pt-BR')} kg`
                    : 'Ainda sem execução salva para este treino.'}
                </p>
              </div>
              ${selW.id !== recId ? `
                <button type="button" data-start-workout="${selW.id}" class="btn-primary" style="width:auto;min-height:44px;padding:9px 15px;font-size:12px;">
                  ▶ Iniciar ${selW.name}
                </button>

            <div class="card-dark" style="border-color:var(--amber-border);font-size:12px;color:#e2e8f0;">

            </div>

            <div class="stack-sm" style="gap:11px;">
              ${selW.exercises.map((ex, i) => {
                const prefIdx = Number(state.preferredExVariant[ex.id]) || 0;
                const opt = getActiveExerciseOption(ex, prefIdx);
                const lastRec = getLastRecordForExercise(ex.id, opt.name);
                const guideOpen = ui.openGuideId === ex.id;
                const lastTxt = lastRec
                  ? lastRec.sets.map(st => opt.isometria ? `${st.reps}s` : `${st.kg}kg×${st.reps}`).join(' · ')

              }).join('')}

    // ==================== TREINO GUIADO ====================
    function startGuidedSession(workoutId) {
      const w = WORKOUTS[workoutId];
      if (!w) return;

      const draftExercises = w.exercises.map(ex => {
        const prefIdx = Number(state.preferredExVariant[ex.id]) || 0;
        const opt = getActiveExerciseOption(ex, prefIdx);
        const lastRec = getLastRecordForExercise(ex.id, opt.name);
        const sets = Array.from({ length: ex.sets }, (_, idx) => {
          const prev = lastRec?.sets?.[idx] || lastRec?.sets?.[lastRec.sets.length - 1];
          const kg = opt.isometria ? 0 : (prev && prev.kg !== '' && prev.kg !== undefined ? Number(prev.kg) : '');
          const reps = (prev && prev.reps !== '' && Boolean(lastRec.isometria) === Boolean(opt.isometria))
            ? Number(prev.reps)
            : (opt.isometria ? (ex.isoDefaultSec || 35) : opt.repMin);
          return { kg, reps, done: false };
        });
        return { exId: ex.id, variantIndex: prefIdx, usedSubstitute: prefIdx > 0, sets };
      });

      state.selectedWorkoutId = workoutId;
      state.activeSession = {
        workoutId,
        startedAt: new Date().toISOString(),
        resumedAt: Date.now(),
        accumulatedSec: 0,
        running: true,
        currentExIndex: 0,
        exercises: draftExercises
      };

      ui.openGuideId = null;
      ui.inlineEmbedKey = null;
      ui.guidedViewAll = false;
      ensureSessionTicker();
      persistState();
      renderApp();
      showToast(`▶ ${w.name} iniciado! Postura segura e RIR 2–3!`, 'success');
    }

    function renderGuidedSessionView() {
      const s = state.activeSession;
      const w = WORKOUTS[s.workoutId];
      const elapsed = getSessionElapsedSec(s);
      const timePct = Math.min(100, Math.round((elapsed / 1800) * 100));

      let totalSets = 0, doneSets = 0;
      s.exercises.forEach(e => e.sets.forEach(st => { totalSets++; if (st.done) doneSets++; }));

      const curIdx = Math.max(0, Math.min(w.exercises.length - 1, s.currentExIndex || 0));

      return `
        <div class="stack anim-in">
          <!-- Cabeçalho Fixo da Sessão -->
          <section class="sticky-session stack-sm">
            <div class="row-between">
              <div style="min-width:0;">
                <div style="display:flex;align-items:center;gap:7px;">
                  <span style="width:9px;height:9px;border-radius:99px;background:${s.running ? '#10b981' : '#f59e0b'};"></span>
                  <span style="font-size:12px;font-weight:900;text-transform:uppercase;color:#fda4af;">${w.name} em andamento</span>
                </div>
                <div class="muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${w.focus}</div>
              </div>

              <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
                <span id="sessionTimerDisplay" class="tabular" style="min-height:44px;display:inline-flex;align-items:center;padding:0 10px;border-radius:11px;background:var(--bg);border:1px solid var(--border);font-size:15px;font-weight:900;color:#fff;">${formatMMSS(elapsed)}</span>
                <button type="button" id="btnPauseSess" class="btn-secondary" style="width:44px;padding:0;" title="Pausar/Retomar">${s.running ? '⏸' : '▶'}</button>
                <button type="button" id="btnCancelSess" class="btn-secondary" style="width:44px;padding:0;color:#fca5a5;border-color:rgba(239,68,68,0.4);" title="Descartar">✕</button>
              </div>
            </div>

            <div>
              <div class="row-between" style="font-size:11px;color:#94a3b8;margin-bottom:5px;">
                <span>Séries concluídas: <strong style="color:#6ee7b7;">${doneSets}/${totalSets}</strong></span>
                <span>Meta sessão: 30:00</span>
              </div>
              <div class="progress-track">
                <div id="sessionTimeBar" class="progress-fill" style="width:${timePct}%;"></div>
              </div>
            </div>

            <div class="row-between">
              <div style="display:flex;gap:6px;overflow-x:auto;">
                ${w.exercises.map((ex, idx) => {
                  const allDone = s.exercises[idx].sets.every(st => st.done);
                  const active = !ui.guidedViewAll && idx === curIdx;
                  return `<button type="button" data-jump-ex="${idx}" class="jump-pill ${active ? 'active' : allDone ? 'done' : ''}">${allDone ? '✓' : idx + 1}</button>`;
                }).join('')}
              </div>
              <button type="button" id="btnToggleAllEx" class="btn-outline-emerald" style="min-height:40px;padding:6px 11px;font-size:11px;flex-shrink:0;">
                ${ui.guidedViewAll ? '1 por vez' : 'Ver todos'}
              </button>
            </div>
          </section>

          <!-- Exercício(s) -->
          <div class="stack">
            ${ui.guidedViewAll
              ? w.exercises.map((ex, idx) => renderGuidedExCard(ex, idx, s.exercises[idx], w.exercises.length)).join('')
              : renderGuidedExCard(w.exercises[curIdx], curIdx, s.exercises[curIdx], w.exercises.length)
            }
          </div>

          ${!ui.guidedViewAll ? `
            <div class="grid-2-fixed">
              <button type="button" id="btnPrevEx" ${curIdx === 0 ? 'disabled' : ''} class="btn-secondary">← Anterior</button>
              <button type="button" id="btnNextEx" ${curIdx >= w.exercises.length - 1 ? 'disabled' : ''} class="btn-outline-rose">Próximo →</button>
            </div>
          ` : ''}

          <!-- Botão Finalizar -->
          <section class="card">
            <button type="button" id="btnOpenFinishModal" class="btn-primary">
              <span>✔</span>
              <span>Finalizar e Avaliar Quadril (${doneSets}/${totalSets} séries)</span>
            </button>
          </section>
        </div>
      `;
    }

    function renderGuidedExCard(ex, exIdx, draftEx, totalEx) {
      const vIdx = typeof draftEx.variantIndex === 'number' ? draftEx.variantIndex : 0;
      const opt = getActiveExerciseOption(ex, vIdx);
      const lastRec = getLastRecordForExercise(ex.id, opt.name);
      const prog = getProgressionTip(ex, opt, lastRec);
      const guideOpen = ui.openGuideId === ex.id;
      const isIso = Boolean(opt.isometria);

      return `
        <article class="card stack-sm" style="gap:12px;border-color:${vIdx > 0 ? 'var(--emerald-border)' : '#334155'};">
          <div class="row-between" style="flex-wrap:wrap;">
            <div class="flex-wrap">
              <span class="badge badge-rose">Exercício ${exIdx + 1} de ${totalEx}</span>
              ${vIdx > 0 ? '<span class="badge badge-emerald">🔄 Substituta</span>' : ''}
            </div>
            <button type="button" data-toggle-guide="${ex.id}" class="${guideOpen ? 'btn-primary' : 'btn-outline-emerald'}" style="width:auto;min-height:44px;padding:7px 12px;font-size:11.5px;">
              🎥 ${guideOpen ? 'Fechar Vídeo' : 'Ver vídeo / detalhes'}
            </button>
          </div>

          <div>
            <h3 class="h2" style="font-size:17px;">${escapeHtml(opt.name)}</h3>
            <div class="flex-wrap" style="margin-top:5px;font-size:12px;font-weight:700;">
              <span style="color:#fda4af;">${ex.sets} séries × ${opt.repLabel}</span>
              <span style="color:#475569;">•</span>
              <span style="color:#6ee7b7;">⏱ Descanso ${ex.restSec}s</span>
            </div>
          </div>

          ${ex.hipAlert ? `<div class="hip-alert-box"><strong>🛡️ Quadril Esquerdo:</strong> ${escapeHtml(ex.hipAlert)}</div>` : ''}

          ${isIso ? `
            <button type="button" data-iso-timer="${ex.isoDefaultSec || 35}" class="btn-outline-rose" style="width:100%;font-size:13px;font-weight:900;">
              🧘‍♀️ Iniciar Cronômetro de Isometria (${ex.isoDefaultSec || 35}s)
            </button>
          ` : ''}

          ${renderInlineSubStrip(ex, vIdx, 'session', exIdx)}

          <!-- Referência Anterior + Progressão -->
          <div class="card-dark stack-sm" style="gap:6px;font-size:12px;">
            <div class="row-between" style="flex-wrap:wrap;">
              <span style="color:#94a3b8;">📌 Último: <strong style="color:#fff;">${lastRec ? lastRec.sets.map(st => isIso ? `${st.reps}s` : `${st.kg}kg×${st.reps}`).join(' · ') : 'Primeiro registro'}</strong></span>
              ${lastRec ? `<span style="font-size:10px;color:#64748b;">${formatShortDate(lastRec.date)}</span>` : ''}
            </div>
            <div style="padding-top:6px;border-top:1px solid var(--border-soft);color:#e2e8f0;font-size:11.5px;">
              <strong style="color:${prog.type === 'up' ? '#6ee7b7' : '#fda4af'};">${prog.label}:</strong> ${prog.text}
            </div>
          </div>

          ${guideOpen ? renderExerciseGuide(ex, vIdx) : ''}

          <!-- Checklist de Séries -->
          <div class="stack-sm">
            <div style="display:grid;grid-template-columns:36px 1fr 1fr 48px;gap:6px;padding:0 6px;font-size:10px;font-weight:800;text-transform:uppercase;color:#94a3b8;text-align:center;">
              <span style="text-align:left;">Série</span>
              <span>${isIso ? 'Isometria' : 'Carga (kg)'}</span>
              <span>${isIso ? 'Segundos' : 'Reps'}</span>
              <span>Feito</span>
            </div>

            ${draftEx.sets.map((st, sIdx) => `
              <div class="set-row ${st.done ? 'done' : ''}">
                <span class="set-badge">S${sIdx + 1}</span>
                ${isIso ? `
                  <button type="button" data-iso-timer="${Number(st.reps) || 35}" class="btn-outline-rose" style="height:44px;font-size:11.5px;padding:0 6px;">⏱ ${Number(st.reps) || 35}s</button>
                ` : `
                  <div class="stepper">
                    <button type="button" data-kg-step="${exIdx}:${sIdx}:-2.5" class="step-btn" aria-label="Diminuir carga">−</button>
                    <input type="number" step="0.5" inputmode="decimal" data-kg-inp="${exIdx}:${sIdx}" value="${st.kg}" placeholder="0" class="step-input tabular" />
                    <button type="button" data-kg-step="${exIdx}:${sIdx}:2.5" class="step-btn" aria-label="Aumentar carga">+</button>
                  </div>
                `}
                <div class="stepper">
                  <button type="button" data-rep-step="${exIdx}:${sIdx}:${isIso ? -5 : -1}" class="step-btn" aria-label="Diminuir reps">−</button>
                  <input type="number" inputmode="numeric" data-rep-inp="${exIdx}:${sIdx}" value="${st.reps}" placeholder="${opt.repMin}" class="step-input tabular" />
                  <button type="button" data-rep-step="${exIdx}:${sIdx}:${isIso ? 5 : 1}" class="step-btn" aria-label="Aumentar reps">+</button>

                <button type="button" data-set-done="${exIdx}:${sIdx}" class="check-btn" aria-label="Concluir série">✓</button>

        </article>
      `;

    function openFinishSessionModal() {
      const s = state.activeSession;
      if (!s) return;
      const w = WORKOUTS[s.workoutId];
      const durSec = getSessionElapsedSec(s);
      let doneSets = 0, plannedSets = 0, totalVol = 0;

      w.exercises.forEach((ex, idx) => {
        plannedSets += ex.sets;
        const dr = s.exercises[idx];
        const opt = getActiveExerciseOption(ex, dr.variantIndex || 0);
        dr.sets.forEach(st => {
          if (st.done) {
            doneSets++;
            if (!opt.isometria) totalVol += (Number(st.kg) || 0) * (Number(st.reps) || 0);
          }
        });
      });

      if (doneSets === 0) {
        showToast('Marque pelo menos 1 série concluída antes de finalizar.', 'error');
        return;
      }

      const prevSame = getLastSessionForWorkout(s.workoutId);
      const diffVol = prevSame ? Math.round(totalVol) - prevSame.totalVolumeKg : null;
      const diffPct = prevSame && prevSame.totalVolumeKg > 0 ? Math.round((diffVol / prevSame.totalVolumeKg) * 100) : null;

      let chosenHip = 'ok'; // 'ok' | 'mild' | 'discomfort'

      openModal({
        title: `✔ Finalizar ${w.name}`,
        bodyHtml: `
          <div class="stack-sm" style="gap:13px;">
            <div class="grid-3" style="text-align:center;">
              <div class="card-dark">
                <div style="font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;">Duração</div>
                <div class="tabular" style="font-size:17px;font-weight:900;color:#fff;margin-top:2px;">${formatMMSS(durSec)}</div>
              </div>
              <div class="card-dark">
                <div style="font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;">Séries</div>
                <div class="tabular" style="font-size:17px;font-weight:900;color:#6ee7b7;margin-top:2px;">${doneSets}/${plannedSets}</div>
              </div>
              <div class="card-dark">
                <div style="font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;">Volume</div>

    function applyExerciseSubstitute(mode, refKey, chosenIdx, fixDefault = false) {
      let ex = null;
      if (mode === 'session' && state.activeSession) {
        const idx = Number(refKey);
        ex = WORKOUTS[state.activeSession.workoutId]?.exercises?.[idx];
        const dr = state.activeSession.exercises[idx];
        if (ex && dr) {
          const prevOpt = getActiveExerciseOption(ex, dr.variantIndex || 0);
          const nextOpt = getActiveExerciseOption(ex, chosenIdx);
          dr.variantIndex = chosenIdx;
          dr.usedSubstitute = chosenIdx > 0;
          if (Boolean(prevOpt.isometria) !== Boolean(nextOpt.isometria)) {
            dr.sets.forEach(st => {
              if (!st.done) {
                st.kg = nextOpt.isometria ? 0 : '';
                st.reps = nextOpt.isometria ? 35 : nextOpt.repMin;
              }
            });
          }
          if (fixDefault) state.preferredExVariant[ex.id] = chosenIdx;
        }
      } else {
        ex = ALL_EXERCISES.find(e => e.id === refKey);
        if (ex) state.preferredExVariant[ex.id] = chosenIdx;
      }
      if (!ex) return;
      ui.inlineEmbedKey = null;
      const opt = getActiveExerciseOption(ex, chosenIdx);
      persistState();
      renderApp();
      showToast(`🔄 Máquina selecionada: ${opt.name}`, 'success');
    }

    function openExerciseSubModal(mode, refKey) {
      let ex = null, curIdx = 0;
      if (mode === 'session' && state.activeSession) {
        const idx = Number(refKey);
        ex = WORKOUTS[state.activeSession.workoutId]?.exercises?.[idx];
        curIdx = state.activeSession.exercises[idx]?.variantIndex || 0;
      } else {
        ex = ALL_EXERCISES.find(e => e.id === refKey);
        curIdx = Number(state.preferredExVariant[refKey]) || 0;
      }
      if (!ex) return;

      const variants = getExerciseVariants(ex);
      openModal({
        title: `🔄 Substitutos — ${ex.shortName}`,
        bodyHtml: `
          <div class="stack-sm">
            <p class="muted" style="margin:0;">Escolha qualquer máquina/polia equivalente com vídeo demonstrativo próprio:</p>
            ${variants.map((v, idx) => {
              const sel = idx === curIdx;
              return `
                <div class="card-dark" style="border:2px solid ${sel ? 'var(--rose)' : 'var(--border)'};">
                  <div class="row-start">
                    <div style="min-width:0;">
                      <div class="flex-wrap" style="margin-bottom:4px;">
                        <span class="badge ${v.isPrincipal ? 'badge-rose' : 'badge-emerald'}">${v.isPrincipal ? 'Padrão' : `Substituta ${idx}`}</span>
                        ${sel ? '<span style="font-size:11px;font-weight:800;color:#6ee7b7;">✓ Em uso</span>' : ''}
                      </div>
                      <div style="font-size:14px;font-weight:800;color:#fff;">${escapeHtml(v.name)}</div>
                      <div class="muted" style="font-size:11px;margin-top:3px;">${escapeHtml(v.note)}</div>
                    </div>
                    <a href="https://www.youtube.com/watch?v=${v.videoId}" target="_blank" rel="noopener noreferrer" class="btn-outline-rose" style="min-height:40px;padding:6px 10px;font-size:11px;flex-shrink:0;">🎥 Vídeo ↗</a>
                  </div>
                  <div style="display:flex;gap:8px;margin-top:10px;">
                    <button type="button" data-pick-sub="${idx}:once" class="${sel ? 'btn-secondary' : 'btn-emerald'}" style="flex:1;">
                      ${mode === 'session' ? (sel ? 'Em uso hoje' : 'Usar hoje') : (sel ? 'Padrão atual' : 'Definir padrão')}
                    </button>
                    ${mode === 'session' && !sel ? `<button type="button" data-pick-sub="${idx}:always" class="btn-outline-rose" style="padding:9px 12px;font-size:11px;">Fixar padrão</button>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `,
        hideConfirm: true,
        cancelText: 'Fechar'
      });

      document.querySelectorAll('[data-pick-sub]').forEach(b => {
        b.addEventListener('click', () => {
          const [iStr, scope] = b.dataset.pickSub.split(':');
          closeModal();
          applyExerciseSubstitute(mode, refKey, Number(iStr), scope === 'always');
        });
      });
    }

    function bindTreinoEvents() {
      document.getElementById('btnToggleHipBanner')?.addEventListener('click', () => {
        state.hipBannerCollapsed = !state.hipBannerCollapsed;
        persistState(); renderApp();
      });

      document.querySelectorAll('[data-select-workout]').forEach(b => b.addEventListener('click', () => {
        state.selectedWorkoutId = b.dataset.selectWorkout;
        ui.openGuideId = null; ui.inlineEmbedKey = null;
        persistState(); renderApp();
      }));

      document.querySelectorAll('[data-start-workout]').forEach(b => b.addEventListener('click', () => startGuidedSession(b.dataset.startWorkout)));

      document.querySelectorAll('[data-toggle-guide]').forEach(b => b.addEventListener('click', () => {
        ui.openGuideId = ui.openGuideId === b.dataset.toggleGuide ? null : b.dataset.toggleGuide;
        ui.inlineEmbedKey = null;
        renderApp();
      }));

      document.querySelectorAll('[data-open-embed]').forEach(b => b.addEventListener('click', () => { ui.inlineEmbedKey = b.dataset.openEmbed; renderApp(); }));
      document.querySelectorAll('[data-close-embed]').forEach(b => b.addEventListener('click', () => { ui.inlineEmbedKey = null; renderApp(); }));

      document.querySelectorAll('[data-quick-ex-sub]').forEach(b => b.addEventListener('click', () => {
        const [m, k, i] = b.dataset.quickExSub.split(':');
        applyExerciseSubstitute(m, k, Number(i), false);
      }));

      document.querySelectorAll('[data-open-ex-sub]').forEach(b => b.addEventListener('click', () => {
        const [m, k] = b.dataset.openExSub.split(':');
        openExerciseSubModal(m, k);
      }));

      document.getElementById('btnPauseSess')?.addEventListener('click', () => {
        const s = state.activeSession;
        if (!s) return;
        if (s.running) { s.accumulatedSec = getSessionElapsedSec(s); s.running = false; s.resumedAt = null; clearInterval(ui.sessionTickInterval); }
        else { s.running = true; s.resumedAt = Date.now(); ensureSessionTicker(); }
        persistState(); renderApp();
      });

      document.getElementById('btnCancelSess')?.addEventListener('click', () => {
        openModal({
          title: 'Descartar treino atual?',
          bodyHtml: '<p class="muted" style="margin:0;">As séries desta sessão serão descartadas, mantendo todo o histórico anterior salvo.</p>',
          confirmText: 'Sim, descartar',
          cancelText: 'Continuar',
          onConfirm: () => { clearInterval(ui.sessionTickInterval); stopFloatTimer(); state.activeSession = null; persistState(); renderApp(); showToast('Sessão descartada.', 'info'); }
        });
      });

      document.getElementById('btnOpenFinishModal')?.addEventListener('click', openFinishSessionModal);
      document.getElementById('btnToggleAllEx')?.addEventListener('click', () => { ui.guidedViewAll = !ui.guidedViewAll; renderApp(); });

      document.querySelectorAll('[data-jump-ex]').forEach(b => b.addEventListener('click', () => {
        if (!state.activeSession) return;
        state.activeSession.currentExIndex = Number(b.dataset.jumpEx);
        ui.guidedViewAll = false;
        persistState(); renderApp();
      }));

      document.getElementById('btnPrevEx')?.addEventListener('click', () => {
        if (state.activeSession && state.activeSession.currentExIndex > 0) {
          state.activeSession.currentExIndex--; persistState(); renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      document.getElementById('btnNextEx')?.addEventListener('click', () => {
        if (!state.activeSession) return;
        const max = WORKOUTS[state.activeSession.workoutId].exercises.length - 1;
        if (state.activeSession.currentExIndex < max) {
          state.activeSession.currentExIndex++; persistState(); renderApp(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });

      document.querySelectorAll('[data-kg-step]').forEach(b => b.addEventListener('click', () => {
        const [eI, sI, d] = b.dataset.kgStep.split(':').map(Number);
        const st = state.activeSession?.exercises?.[eI]?.sets?.[sI];
        if (!st) return;
        st.kg = Math.max(0, Math.round(((Number(st.kg) || 0) + d) * 10) / 10);
        persistState(); renderApp();
      }));

      document.querySelectorAll('[data-kg-inp]').forEach(inp => inp.addEventListener('input', e => {
        const [eI, sI] = inp.dataset.kgInp.split(':').map(Number);
        const st = state.activeSession?.exercises?.[eI]?.sets?.[sI];
        if (st) { st.kg = e.target.value; persistState(); }
      }));

      document.querySelectorAll('[data-rep-step]').forEach(b => b.addEventListener('click', () => {
        const [eI, sI, d] = b.dataset.repStep.split(':').map(Number);
        const st = state.activeSession?.exercises?.[eI]?.sets?.[sI];
        if (!st) return;
        st.reps = Math.max(0, (Number(st.reps) || 0) + d);
        persistState(); renderApp();
      }));

      document.querySelectorAll('[data-rep-inp]').forEach(inp => inp.addEventListener('input', e => {
        const [eI, sI] = inp.dataset.repInp.split(':').map(Number);
        const st = state.activeSession?.exercises?.[eI]?.sets?.[sI];
        if (st) { st.reps = e.target.value; persistState(); }
      }));

      document.querySelectorAll('[data-set-done]').forEach(b => b.addEventListener('click', () => {
        const [eI, sI] = b.dataset.setDone.split(':').map(Number);
        const s = state.activeSession;
        const st = s?.exercises?.[eI]?.sets?.[sI];
        if (!st) return;
        st.done = !st.done;
        if (st.done) startFloatTimer(WORKOUTS[s.workoutId].exercises[eI].restSec, 'rest');
        persistState(); renderApp();
      }));

      document.querySelectorAll('[data-iso-timer]').forEach(b => b.addEventListener('click', () => startFloatTimer(Number(b.dataset.isoTimer) || 35, 'plank')));
      document.querySelectorAll('[data-manual-rest]').forEach(b => b.addEventListener('click', () => startFloatTimer(Number(b.dataset.manualRest) || 45, 'rest')));

      document.querySelectorAll('[data-copy-s1]').forEach(b => b.addEventListener('click', () => {
        const sets = state.activeSession?.exercises?.[Number(b.dataset.copyS1)]?.sets;
        if (!sets || sets.length < 2) return;
        const kg0 = sets[0].kg;
        sets.forEach((st, i) => { if (i > 0) st.kg = kg0; });
        persistState(); renderApp(); showToast(`Carga ${kg0 || 0} kg replicada nas demais séries.`, 'info');
      }));
    }

      if (typeof sel === 'string' && sel.startsWith('custom:')) return { text: sel.slice(7), isSub: true, isCustom: true, subIdx: -2 };
      if (typeof sel === 'number' && sel >= 0 && item.subs[sel]) return { text: item.subs[sel].text, isSub: true, isCustom: false, subIdx: sel };

    function bindDietaEvents() {
      const log = getTodayDietLog();

      document.querySelectorAll('[data-diet-mode]').forEach(b => b.addEventListener('click', () => {
        state.dietMode = b.dataset.dietMode; persistState(); renderApp();
      }));

      document.querySelectorAll('[data-cup-idx]').forEach(b => b.addEventListener('click', () => {
        const target = Number(b.dataset.cupIdx) * 260;
        log.waterMl = log.waterMl === target ? Math.max(0, target - 260) : target;
        persistState(); renderApp();
      }));

      document.querySelectorAll('[data-add-water]').forEach(b => b.addEventListener('click', () => {
        log.waterMl = Math.max(0, Math.min(5200, (Number(log.waterMl) || 0) + Number(b.dataset.addWater)));
        persistState(); renderApp();
      }));

      document.querySelectorAll('[data-wsched]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.wsched;
        log.waterSched[id] = !log.waterSched[id];
        persistState(); renderApp();
      }));

      document.getElementById('inpStepsToday')?.addEventListener('change', e => {
        log.steps = Math.max(0, Number(e.target.value) || 0);
        persistState(); renderApp();
      });

      document.querySelectorAll('[data-add-steps]').forEach(b => b.addEventListener('click', () => {
        log.steps = Math.max(0, (Number(log.steps) || 0) + Number(b.dataset.addSteps));
        persistState(); renderApp();
      }));

      document.querySelectorAll('[data-meal-done]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.mealDone;
        log.mealsDone[id] = !log.mealsDone[id];
        persistState(); renderApp();
      }));

      document.querySelectorAll('[data-quick-meal]').forEach(b => b.addEventListener('click', () => {
        const [itemId, idxStr] = b.dataset.quickMeal.split(':');
        state.mealSubs[itemId] = Number(idxStr);
        persistState(); renderApp();
        showToast(Number(idxStr) === -1 ? 'Padrão restaurado.' : 'Alimento trocado!', 'success');
      }));

      document.querySelectorAll('[data-open-meal-sub]').forEach(b => b.addEventListener('click', () => {
        const [mId, iId] = b.dataset.openMealSub.split(':');
        openMealSubModal(mId, iId);
      }));

      document.getElementById('btnResetDayDiet')?.addEventListener('click', () => {
        openModal({
          title: 'Zerar checklist de hoje?',
          bodyHtml: '<p class="muted" style="margin:0;">Desmarca refeições, água e passos registrados hoje.</p>',
          confirmText: 'Zerar hoje',
          onConfirm: () => {
            state.dailyLogs[getTodayKey()] = { waterMl: 0, waterSched: {}, mealsDone: {}, steps: 0 };
            persistState(); renderApp(); showToast('Dia reiniciado.', 'info');
          }
        });
      });
    }

    function renderLoadChartSVG(exId) {
      const pts = [];
      [...state.workoutHistory].reverse().forEach(sess => {
        const f = (sess.exercises || []).find(e => e.exId === exId && e.sets.some(st => st.done));
        if (f) {
          const done = f.sets.filter(st => st.done);
          const val = f.isometria ? Math.max(...done.map(st => Number(st.reps) || 0)) : Math.max(...done.map(st => Number(st.kg) || 0));
          pts.push({ date: formatShortDate(sess.completedAt), val, unit: f.isometria ? 's' : 'kg' });
        }
      });

      if (!pts.length) {
        return `<div class="card-dark" style="text-align:center;padding:26px 14px;font-size:12px;color:#94a3b8;">Conclua pelo menos 1 treino com esta máquina para visualizar o gráfico de evolução de cargas.</div>`;
      }

      const W = 500, H = 155, pX = 36, pY = 24;
      const vals = pts.map(p => p.val);
      const minV = Math.max(0, Math.min(...vals) - 4);
      const maxV = Math.max(...vals, minV + 8) + 4;
      const span = maxV - minV || 1;

      const coords = pts.map((pt, i) => ({
        ...pt,
        x: pts.length === 1 ? W / 2 : pX + (i / (pts.length - 1)) * (W - pX * 2),
        y: H - pY - ((pt.val - minV) / span) * (H - pY * 2)
      }));
      const poly = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');

      return `
        <div class="card-dark" style="padding:10px;">
          <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:150px;display:block;">
            <line x1="${pX}" y1="${pY}" x2="${W - pX}" y2="${pY}" stroke="#23304d" stroke-dasharray="4"/>
            <line x1="${pX}" y1="${H - pY}" x2="${W - pX}" y2="${H - pY}" stroke="#23304d"/>
            ${coords.length > 1 ? `<polyline fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>` : ''}
            ${coords.map(c => `
              <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="5" fill="#10b981" stroke="#0b1120" stroke-width="2"/>
              <text x="${c.x.toFixed(1)}" y="${(c.y - 10).toFixed(1)}" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="800">${c.val}${c.unit}</text>
              <text x="${c.x.toFixed(1)}" y="${H - 5}" text-anchor="middle" fill="#94a3b8" font-size="10">${c.date}</text>
            `).join('')}
          </svg>
        </div>
      `;
    }

                <li><strong>Ferritina Sérica (221 ng/mL):</strong> discutir solicitação de <strong>Saturação de Transferrina (IST)</strong> e <strong>PCR</strong> para diferenciar reserva de ferro de componente inflamatório.</li>
                <li><strong>Vitamina B12 (1.041 pg/mL):</strong> checar histórico de eventual suplementação prévia; manter sem suplementos de B12.</li>
                <li><strong>Colesterol Total (210 mg/dL):</strong> avaliar dosagem direta de <strong>LDL</strong> e acompanhar resposta ao aumento de fibras solúveis (≥32g/dia) e musculação.</li>
                <li><strong>Quadril esquerdo:</strong> relatar a evolução de conforto/desconforto registrada no histórico do app.</li>

          <!-- Backup & Compartilhamento -->
          <section class="card stack-sm">
            <h3 class="h3">💾 Backup &amp; Compartilhamento</h3>
            <p class="muted" style="margin:0;">Os dados são preservados offline na chave <code>monik_fit_v1_state</code>. Exporte backups ou compartilhe um resumo no WhatsApp/Notas.</p>
            <div class="grid-2">
              <button type="button" id="btnShareSummary" class="btn-primary" style="min-height:46px;font-size:12.5px;">📤 Compartilhar Resumo</button>

              <button type="button" id="btnExportJson" class="btn-secondary" style="font-size:12.5px;">⬇ Exportar Backup (.json)</button>
              <button type="button" id="btnImportJson" class="btn-secondary" style="font-size:12.5px;">⬆ Importar Backup (.json)</button>
            </div>
          </section>
        </div>
      `;
    }

    function bindEvolucaoEvents() {
      document.getElementById('chartExSel')?.addEventListener('change', e => {
        ui.chartExId = e.target.value; renderApp();
      });

      document.querySelectorAll('[data-exp-hist]').forEach(b => b.addEventListener('click', () => {
        ui.expandedHistId = ui.expandedHistId === b.dataset.expHist ? null : b.dataset.expHist;
        renderApp();
      }));

      document.querySelectorAll('[data-share-sess]').forEach(b => b.addEventListener('click', () => {
        const s = state.workoutHistory.find(x => x.id === b.dataset.shareSess);
        if (s) shareWorkout(s);
      }));

      document.querySelectorAll('[data-del-sess]').forEach(b => b.addEventListener('click', () => {
        const id = b.dataset.delSess;
        openModal({
          title: 'Excluir sessão?',
          bodyHtml: '<p class="muted" style="margin:0;">Remove permanentemente este treino do histórico.</p>',
          confirmText: 'Excluir',
          onConfirm: () => { state.workoutHistory = state.workoutHistory.filter(x => x.id !== id); persistState(); renderApp(); showToast('Sessão excluída.', 'info'); }
        });
      }));

      document.getElementById('bodyForm')?.addEventListener('submit', e => {
        e.preventDefault();
        const date = document.getElementById('bfDate').value;
        const weight = Number(document.getElementById('bfWeight').value);
        const bf = document.getElementById('bfFat').value;
        const water = document.getElementById('bfWater').value;
        const muscle = document.getElementById('bfMuscle').value;
        if (!date || !weight) return;
        state.bodyLogs.push({
          id: 'body_' + Date.now(),
          date,
          weight,
          bf: bf ? Number(bf) : '',
          muscleKg: muscle ? Number(muscle) : '',
          waterPct: water ? Number(water) : '',
          note: ''
        });
        persistState(); renderApp(); showToast('Nova medição corporal salva!', 'success');
      });

      document.querySelectorAll('[data-del-body]').forEach(b => b.addEventListener('click', () => {
        state.bodyLogs = state.bodyLogs.filter(x => x.id !== b.dataset.delBody);
        persistState(); renderApp();
      }));

      document.getElementById('btnShareSummary')?.addEventListener('click', shareFullSummary);
      document.getElementById('btnExportCsv')?.addEventListener('click', exportCSV);
      document.getElementById('btnExportJson')?.addEventListener('click', exportJSON);
      document.getElementById('btnImportJson')?.addEventListener('click', () => document.getElementById('importJsonInput')?.click());
    }

    // ==================== COMPARTILHAR, CSV, JSON & MODAIS GUIA ====================
    function copyFallback(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    async function shareOrCopy(title, text) {
      if (typeof navigator !== 'undefined' && typeof navigator.share === 'function') {
        try {
          await navigator.share({ title, text });
          showToast('Compartilhado com sucesso!', 'success');
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      if (copyFallback(text)) showToast('Resumo copiado! Cole no WhatsApp ou Notas.', 'success');
      else showToast('Não foi possível copiar automaticamente.', 'error');
    }

    function shareWorkout(s) {
      const hb = hipBadgeMeta(s.hipStatus).label;
      const lines = [
        `🏋️ Monik Fit — ${s.workoutName} (${s.workoutFocus})`,
        `📅 ${formatShortDateTime(s.completedAt)} | ⏱ ${formatMMSS(s.durationSec)}`,
        `📊 ${s.totalSetsDone}/${s.totalSetsPlanned} séries | Volume: ${Number(s.totalVolumeKg).toLocaleString('pt-BR')} kg`,
        `🛡️ Quadril Esq.: ${hb}`,
        ''
      ];
      (s.exercises || []).forEach((ex, i) => {
        const str = ex.sets.filter(st => st.done).map(st => ex.isometria ? `${st.reps}s` : `${st.kg}kg×${st.reps}`).join(', ') || 'pulado';
        lines.push(`${i + 1}. ${ex.executedName}: ${str}`);
      });
      if (s.notes) lines.push(`\n📝 Obs: ${s.notes}`);
      shareOrCopy(`Monik Fit — ${s.workoutName}`, lines.join('\n'));
    }

    function shareFullSummary() {
      const log = getTodayDietLog();
      const sortedBody = [...state.bodyLogs].sort((a, b) => a.date.localeCompare(b.date));
      const latest = sortedBody[sortedBody.length - 1];
      const mealsDone = MEALS.filter(m => log.mealsDone[m.id]).length;
      const lines = [
        `📋 Resumo Monik Fit (${formatShortDate(getTodayKey())})`,
        `⚖️ Peso: ${Number(latest.weight).toFixed(2).replace('.', ',')} kg | Gordura: ${latest.bf || 37.5}% | Água: ${latest.waterPct || 46.1}%`,
        `🥗 Dieta (${DIET_MODES[state.dietMode].title}): ${mealsDone}/4 refeições hoje`,
        `💧 Água hoje: ${((Number(log.waterMl) || 0) / 1000).toFixed(2).replace('.', ',')} L / 2,60 L | 🚶 Passos: ${(log.steps || 0).toLocaleString('pt-BR')}`,
        `🏋️ Treinos salvos: ${state.workoutHistory.length}`,
        `🩺 Exames Out/2026: Ferritina 221 | B12 1041 | Col. Total 210 | HDL 60 | TG 51 | Vit D 51,9 | A1c 4,8%`,
        ''
      ];
      state.workoutHistory.slice(0, 5).forEach(s => {
        lines.push(`- ${s.workoutName} (${formatShortDate(s.completedAt)}) · ${formatMMSS(s.durationSec)} · ${hipBadgeMeta(s.hipStatus).label}`);
      });
      shareOrCopy('Resumo Monik Fit (Out/2026)', lines.join('\n'));
    }

    function exportCSV() {
      try {
        const rows = [['Data', 'Treino', 'Duracao_Seg', 'Quadril_Esquerdo', 'Exercicio_Executado', 'Substituto', 'Series_Feitas', 'Carga_Max_ou_Seg', 'Volume_kg']];
        state.workoutHistory.forEach(s => {
          (s.exercises || []).forEach(ex => {
            const done = (ex.sets || []).filter(st => st.done);
            const maxVal = done.length ? Math.max(...done.map(st => Number(ex.isometria ? st.reps : st.kg) || 0)) : 0;
            const vol = ex.isometria ? 0 : done.reduce((a, st) => a + ((Number(st.kg) || 0) * (Number(st.reps) || 0)), 0);
            rows.push([
              s.completedAt,
              s.workoutName,
              s.durationSec,
              s.hipStatus || 'ok',
              `"${String(ex.executedName || '').replace(/"/g, '""')}"`,
              ex.usedSubstitute ? 'Sim' : 'Nao',
              done.length,
              maxVal,
              Math.round(vol)
            ]);
          });
        });
        const blob = new Blob(['\uFEFF' + rows.map(r => r.join(';')).join('\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `monik-fit-treinos-${getTodayKey()}.csv`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Planilha (.csv) exportada!', 'success');
      } catch { showToast('Erro ao exportar CSV.', 'error'); }
    }

    function exportJSON() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup-monik-fit-${getTodayKey()}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Backup (.json) baixado!', 'success');
      } catch { showToast('Erro ao exportar backup.', 'error'); }
    }

    function openHipProtocolModal() {

    function openSaveModal() {
      openModal({
        title: '📱 Salvar Monik Fit na Tela Inicial',
        bodyHtml: `
          <div class="stack-sm" style="font-size:12px;color:#e2e8f0;line-height:1.5;">
            <div class="card-dark" style="border-color:var(--rose-border);">
              <strong style="color:#fda4af;">🍎 iPhone (Safari) — Recomendado!</strong>
              <ol style="margin:6px 0 0;padding-left:18px;">
                <li>Renomeie este arquivo para <code>index.html</code> dentro de uma pasta e envie grátis em <strong>app.netlify.com/drop</strong> (ou Tiiny.host).</li>
                <li>Abra o link <code>https://...</code> gerado no <strong>Safari</strong> do iPhone.</li>

              </ol>
            </div>

              <strong style="color:#7dd3fc;">🤖 Android (Chrome / Samsung)</strong>
              <ol style="margin:6px 0 0;padding-left:18px;">
                <li><strong>Via Link (melhor):</strong> abra o link hospedado no Chrome → menu <strong>⋮</strong> → <strong>Adicionar à tela inicial</strong>.</li>
                <li><strong>Local offline (Samsung):</strong> abra <strong>Meus Arquivos</strong> → Downloads → segure o dedo sobre <code>monik_fit.html</code> → <strong>Mais (⋮)</strong> → <strong>Adicionar à tela inicial</strong>.</li>
              </ol>
            </div>
            <p class="muted" style="margin:0;font-size:11px;">✨ Arquivo <strong>100% offline-ready</strong>: sem CDN externo, abre instantaneamente mesmo sem sinal na academia.</p>
          </div>
        `,
        hideConfirm: true,
        cancelText: 'Fechar'
      });

    // ==================== RENDERIZAÇÃO GLOBAL & BOOT ====================
    function switchTab(tab) {
      state.activeTab = tab;
      persistState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNav() {
      document.querySelectorAll('.nav-desk, .nav-mob').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
      });
    }

    function renderApp() {
      try {
        updateNav();
        const root = document.getElementById('appRoot');
        if (!root) return;
        if (state.activeTab === 'treino') {
          root.innerHTML = renderTreinoTab();
          bindTreinoEvents();
        } else if (state.activeTab === 'dieta') {
          root.innerHTML = renderDietaTab();
          bindDietaEvents();
        } else {
          root.innerHTML = renderEvolucaoTab();
          bindEvolucaoEvents();
        }
      } catch (err) {
        console.error('Erro de renderização:', err);
        const root = document.getElementById('appRoot');
        if (root) root.innerHTML = `<div class="card" style="border-color:#ef4444;color:#fecaca;">Erro ao renderizar: ${escapeHtml(err.message)}</div>`;
      }
    }

    function initApp() {
      loadState();

      document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));
      document.getElementById('btnTopHip')?.addEventListener('click', openHipProtocolModal);
      document.getElementById('btnTopSave')?.addEventListener('click', openSaveModal);

      document.getElementById('btnTimerPlus15')?.addEventListener('click', () => {
        ui.timerSec += 15;
        const d = document.getElementById('floatTimerDisplay');
        if (d) d.textContent = formatMMSS(ui.timerSec);
      });
      document.getElementById('btnTimerStop')?.addEventListener('click', stopFloatTimer);

      document.getElementById('modalCloseX')?.addEventListener('click', closeModal);
      document.getElementById('modalCancelBtn')?.addEventListener('click', closeModal);
      document.getElementById('appModal')?.addEventListener('click', e => { if (e.target.id === 'appModal') closeModal(); });
      document.getElementById('modalConfirmBtn')?.addEventListener('click', () => {
        const cb = ui.modalConfirmCb;
        closeModal();
        if (typeof cb === 'function') cb();
      });

      document.getElementById('importJsonInput')?.addEventListener('change', e => {
        const f = e.target.files?.[0];
        if (!f) return;
        const rd = new FileReader();
        rd.onload = ev => {
          try {
            state = mergeStateSafely(JSON.parse(String(ev.target.result)));
            persistState(); renderApp();
            showToast('Backup restaurado com sucesso!', 'success');
          } catch { showToast('Arquivo JSON inválido.', 'error'); }
        };
        rd.readAsText(f);
        e.target.value = '';
      });

      if (state.activeSession && state.activeSession.running) ensureSessionTicker();
      renderApp();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
    else initApp();
  </script>
